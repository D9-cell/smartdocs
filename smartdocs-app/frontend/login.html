<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartDocs — Sign in</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <div id="auth-wrap">
    <h1 id="auth-title">Sign in</h1>
    <form id="auth-form">
      <div class="field" id="display-name-field" hidden>
        <label for="displayName">Name</label>
        <input id="displayName" name="displayName" type="text" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div id="auth-error" role="alert"></div>
      <button type="submit" id="auth-submit">Sign in</button>
    </form>
    <button type="button" id="auth-toggle">Need an account? Register instead</button>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
