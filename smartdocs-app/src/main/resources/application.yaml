spring:
  application:
    name: smartdocs

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartdocs}
    username: ${DB_USER:smartdocs}
    password: ${DB_PASSWORD:smartdocs}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:}

  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false

smartdocs:
  content:
    max-bytes: 1048576
  request:
    max-body-bytes: 2097152
  document:
    max-per-user: 500
  security:
    # false only for local http development — a Secure cookie is silently
    # ignored by real browsers over plain http (see README).
    cookie-secure: ${SMARTDOCS_COOKIE_SECURE:true}
    # Dev-only default. Override in every real environment — rotating this
    # invalidates historical ip_hash correlation across the boundary, which
    # is the point (design doc section 8.2).
    ip-hash-salt: ${SMARTDOCS_IP_HASH_SALT:dev-only-ip-hash-salt-change-me}
  websocket:
    ticket-ttl-seconds: 30
    max-connections-per-user: 10
    # 1 MiB content cap plus room for envelope/JSON overhead.
    max-text-message-bytes: 1100000
    idle-timeout-seconds: 90
    # No wildcard, ever — exact origins only (design doc section 5.2/9).
    # Comma-separated so it stays a single env var to override.
    allowed-origins: ${SMARTDOCS_WS_ALLOWED_ORIGINS:http://localhost:8080}
    # A missing Origin header is rejected in production (edge case 4) —
    # true only for local wscat/dev-tool testing, same shape as cookie-secure.
    allow-missing-origin: ${SMARTDOCS_WS_ALLOW_MISSING_ORIGIN:false}
    write-executor:
      core-size: 8
      queue-capacity: 200
    outbound-queue-capacity: 32
    outbound-queue-drop-close-threshold: 64
    ticket-cleanup-interval-ms: 600000
    rate-limit:
      per-second: 10
      burst: 20
    heartbeat:
      interval-seconds: 25
      miss-limit: 2
  instance:
    # Stage 2's room registry is in-memory on one node — a second instance
    # silently splits rooms instead of failing loudly. Logged as a startup
    # warning above 1 until Stage 9 moves fanout onto a log.
    count: ${SMARTDOCS_INSTANCE_COUNT:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{requestId}] %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8080}
