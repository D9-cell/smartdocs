spring:
  application:
    name: smartdocs

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartdocs}
    username: ${DB_USER:smartdocs}
    password: ${DB_PASSWORD:smartdocs}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      validation-timeout: 1000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:}

  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false

smartdocs:
  content:
    max-bytes: 1048576
  request:
    max-body-bytes: 4194304

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{requestId}] %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8080}
