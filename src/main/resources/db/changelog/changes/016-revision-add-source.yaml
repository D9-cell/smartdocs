databaseChangeLog:
  - changeSet:
      id: 016-revision-add-source
      author: statecore
      logicalFilePath: db/changelog/changes/016-revision-add-source.yaml
      comment: >
        Records whether a revision arrived over REST or WebSocket. A
        constant default (not volatile, no USING expression) so PostgreSQL
        11+ adds this without rewriting the table.
      changes:
        - addColumn:
            tableName: document_revision
            columns:
              - column:
                  name: source
                  type: varchar(8)
                  defaultValue: REST
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: document_revision
            columnName: source
