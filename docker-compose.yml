services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: statecore
      POSTGRES_USER: statecore
      POSTGRES_PASSWORD: statecore
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - statecore-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statecore -d statecore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  statecore-pgdata:
