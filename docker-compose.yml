services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartdocs
      POSTGRES_USER: smartdocs
      POSTGRES_PASSWORD: smartdocs
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - smartdocs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdocs -d smartdocs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smartdocs-pgdata:
